[project]
name = "agent-platform"
version = "1.0.0"
description = "Mini Agent Platform - Multi-tenant AI agent management with mock LLM pipeline"
authors = [{ name = "Jonathan Toaf" }]
requires-python = ">=3.12"
dependencies = [
    "coloredlogs>=15.0.1",
    "dependency-injector>=4.41.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyhumps>=3.8.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "poethepoet>=0.28.0",
    "ty>=0.0.1a6",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.3",
    "ruff>=0.6.4",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["agent_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["COM812", "ISC001", "G004", "TRY300", "TRY401"]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  "S",
  "B",
  "A",
  "COM",
  "C4",
  "T10",
  "ISC",
  "G",
  "PIE",
  "Q",
  "RET",
  "SLF",
  "SIM",
  "TID",
  "ARG",
  "FIX",
  "PGH",
  "PL",
  "TRY",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["S101", "PLR0913"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Security"]

[tool.coverage.run]
branch = true
source = ["agent_platform"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
fail_under = 100
omit = [
    "agent_platform/data_models/*",
    "agent_platform/db/models/*",
    "agent_platform/db/base.py",
    "agent_platform/exceptions/*",
    "agent_platform/repositories/*",
]
show_missing = true
skip_empty = true

[tool.coverage.html]
skip_empty = true

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check . --fix"
typecheck = "ty check agent_platform"
test = "pytest tests --cov --cov-report term-missing -vv"
clean = """
python -c "
import shutil
import os
for p in ['__pycache__', '.pytest_cache', '.ruff_cache', 'htmlcov', '.coverage']:
    for root, dirs, files in os.walk('.'):
        for d in dirs:
            if d == p:
                shutil.rmtree(os.path.join(root, d), ignore_errors=True)
        for f in files:
            if f == p:
                os.remove(os.path.join(root, f))
"
"""

[tool.poe.tasks.check]
help = "Run all checks (format, lint, typecheck, test)"
sequence = ["format", "lint", "typecheck", "test"]

[tool.poe.tasks.check-fast]
help = "Run all checks without tests"
sequence = ["format", "lint", "typecheck"]
