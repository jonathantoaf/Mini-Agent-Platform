logging:
    version: 1
    disable_existing_loggers: false
    filters:
        request_context:
            (): agent_platform.logging_context.RequestContextFilter
    formatters:
        formatter:
            (): coloredlogs.ColoredFormatter
            format: "[%(asctime)s] [%(name)s] [%(levelname)s] [rid=%(request_id)s] [tenant=%(tenant_id)s] [%(threadName)s] [%(thread)d] %(message)s"
    handlers:
        console:
            class: "logging.StreamHandler"
            level: "DEBUG"
            formatter: "formatter"
            filters: ["request_context"]
            stream: "ext://sys.stdout"
    root:
        level: "DEBUG"
        handlers: ["console"]
